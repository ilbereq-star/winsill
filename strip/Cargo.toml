[package]
name = "winsill-strip"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The strip that draws one pixel-art creature per Claude Code session"
publish = false

[lib]
name = "winsill_strip"

[[bin]]
name = "winsill-strip"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_Globalization"] }
